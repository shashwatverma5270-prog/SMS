<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link rel="stylesheet" href="form.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="sidebar">

        <h2>SDMS</h2>

        <ul>
            <li>
                <a href="dashboard.html">
                    <i class="fa fa-house"></i> Dashboard
                </a>
            </li>

            <li class="active">
                <a href="add-student.html">
                    <i class="fa fa-user-plus"></i> Add Student
                </a>
            </li>

            <li>
                <a href="view-students.html">
                    <i class="fa fa-users"></i> View Students
                </a>
            </li>

            <li>
                <a href="update-delete.html">
                    <i class="fa fa-pen"></i> Search and Update/Delete
                </a>
            </li>

            <li>
                <a href="reports.html">
                    <i class="fa fa-chart-column"></i> Reports
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i class="fa fa-gear"></i> Settings
                </a>
            </li>

            <li>
                <a href="index.html">
                    <i class="fa fa-right-from-bracket"></i> Logout
                </a>
            </li>
        </ul>

    </div>


    <div class="main">

        <h1>Add Student</h1>

        <form id="studentForm">

            <div class="row">

                <input
                    type="text"
                    id="rollNo"
                    name="rollNo"
                    placeholder="Roll Number"
                    required
                >

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Full Name"
                    required
                >

            </div>


            <div class="row">

                <select id="course" name="course">

                    <option value="">Select Course</option>
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="B.Sc">B.Sc</option>

                </select>


                <select id="department" name="department">

                    <option value="">Select Department</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Management">Management</option>
                    <option value="Commerce">Commerce</option>

                </select>

            </div>


            <div class="row">

                <select id="gender" name="gender">

                    <option value="">Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>

                </select>


                <div style="display: flex; flex-direction: column; width: 100%;">

                    <label
                        for="dob"
                        style="font-size: 14px; color: #666; margin-bottom: 5px;"
                    >
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                        name="dob"
                    >

                </div>

            </div>


            <div class="row">

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    placeholder="Phone"
                >

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email"
                >

            </div>


            <div class="buttons">

                <button type="submit">Save</button>

                <button type="reset">Reset</button>

                <a href="dashboard.html">Back</a>

            </div>

        </form>

    </div>

</div>


<script src="student.js"></script>

</body>
</html>
